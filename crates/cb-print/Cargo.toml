[package]
name = "cb-print"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CardBuilder renderer: card sides (text, images, shapes, QR codes, foil) on screen (tiny-skia) and as vector PDF print sheets"

[dependencies]
cb-core = { path = "../cb-core" }
resvg = { version = "0.45", default-features = false, features = ["text"] }
rustybuzz = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
miniz_oxide = "0.8"

[dev-dependencies]
rqrr = "0.11"
