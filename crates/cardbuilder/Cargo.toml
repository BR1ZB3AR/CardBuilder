[package]
name = "cardbuilder"
version = "0.0.15"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CardBuilder — design business cards, greeting cards, game cards and more, with a live 3D preview"

[build-dependencies]
winresource = "0.1.34" # Windows: icon + version info in the .exe (build.rs)

[dependencies]
cb-core = { path = "../cb-core" }
cb-print = { path = "../cb-print" }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
log = "0.4"
lucide-icons = "1.74.0"
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.18.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
tiny_http = "0.12" # the Assistant's MCP server (127.0.0.1 only)

# the web version (trunk build): files come and go through the browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Window", "Element"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
serde_json.workspace = true
