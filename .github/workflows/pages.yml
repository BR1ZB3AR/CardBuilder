# The web version of CardBuilder on GitHub Pages: built with trunk from crates/cardbuilder on
# every push to main (or by hand from the Actions tab), at https://br1zb3ar.github.io/CardBuilder/
name: Web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust with the WebAssembly target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: Trunk
        run: wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin
      - name: Build
        working-directory: crates/cardbuilder
        run: trunk build --release --public-url ./
      - uses: actions/upload-pages-artifact@v4
        with:
          path: crates/cardbuilder/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
